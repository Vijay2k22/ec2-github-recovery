name: 01 - Mumbai Apache infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Mumbai EC2 and ALB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      TF_VAR_github_repo: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check OIDC identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += ("&" if "?" in url else "?") + "audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": (
                      "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
                  )
              },
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          claims = json.loads(
              base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4))
          )

          print("OIDC subject:", claims["sub"])
          print("OIDC audience:", claims["aud"])
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-south-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Initialize S3 state
        working-directory: infra/web
        run: |
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=web/terraform.tfstate" \
            -backend-config="region=ap-south-2" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        working-directory: infra/web
        run: terraform validate

      - name: Plan infrastructure
        working-directory: infra/web
        run: terraform plan -input=false -out=deploy.tfplan

      - name: Apply saved plan
        working-directory: infra/web
        run: terraform apply -input=false deploy.tfplan

      - name: Show configuration for recovery workflow
        working-directory: infra/web
        run: |
          terraform output -json > "$RUNNER_TEMP/web-output.json"

          python3 - <<'PY'
          import json
          import os

          output_path = os.path.join(
              os.environ["RUNNER_TEMP"], "web-output.json"
          )

          with open(output_path) as file:
              outputs = json.load(file)

          values = {
              "ALLOWED_INSTANCE_IDS": ",".join(
                  outputs["instance_ids"]["value"]
              ),
              "TARGET_GROUP_ARN": outputs["target_group_arn"]["value"],
              "RECOVERY_ROLE_ARN": outputs["recovery_role_arn"]["value"],
              "ALB_URL": outputs["alb_url"]["value"],
          }

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Copy these into repository Variables\n\n")

              for key, value in values.items():
                  summary.write(f"- **{key}**: `{value}`\n")
          PY
