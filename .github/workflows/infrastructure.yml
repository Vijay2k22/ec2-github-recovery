name: 01 - Mumbai Apache infrastructure
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: terraform-web
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy Mumbai EC2 and ALB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
        aws-region: ap-south-2
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.0
        terraform_wrapper: false
    - name: Initialize S3 state
      working-directory: infra/web
      run: terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="key=web/terraform.tfstate"
        -backend-config="region=ap-south-2" -backend-config="use_lockfile=true"
    - name: Validate Terraform
      working-directory: infra/web
      run: terraform validate
    - name: Plan infrastructure
      working-directory: infra/web
      run: terraform plan -input=false -out=deploy.tfplan
    - name: Apply saved plan
      working-directory: infra/web
      run: terraform apply -input=false deploy.tfplan
    - name: Show configuration for recovery workflow
      working-directory: infra/web
      run: "terraform output -json > \"$RUNNER_TEMP/web-output.json\"\npython - <<'PYCODE'\nimport json,os\nd=json.load(open(os.environ[\"\
        RUNNER_TEMP\"]+\"/web-output.json\"))\nwith open(os.environ[\"GITHUB_STEP_SUMMARY\"],\"a\") as f:\n    f.write(\"\
        ## Copy these into repository Variables\\n\")\n    for key,value in [(\"ALLOWED_INSTANCE_IDS\",\",\".join(d[\"instance_ids\"\
        ][\"value\"])),(\"TARGET_GROUP_ARN\",d[\"target_group_arn\"][\"value\"]),(\"RECOVERY_ROLE_ARN\",d[\"recovery_role_arn\"\
        ][\"value\"]),(\"ALB_URL\",d[\"alb_url\"][\"value\"])]:\n        f.write(f\"- **{key}**: `{value}`\\n\")\nPYCODE"
