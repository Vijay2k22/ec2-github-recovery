name: 02 - Hyderabad monitor and agent
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - agent/**
    - scripts/deploy_agent.py
    - infra/monitor/**
    - .github/workflows/deploy-agent.yml
permissions:
  contents: read
  id-token: write
concurrency:
  group: terraform-monitor
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy Hyderabad EC2 and monitoring container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      TF_VAR_state_bucket: ${{ vars.STATE_BUCKET }}
      GH_APP_ID: ${{ vars.GH_APP_ID }}
      GH_INSTALLATION_ID: ${{ vars.GH_INSTALLATION_ID }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
        aws-region: ap-south-2
    - name: Check configuration
      run: 'test -n "$STATE_BUCKET"

        test -n "$GH_APP_ID"

        test -n "$GH_INSTALLATION_ID"'
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.0
        terraform_wrapper: false
    - name: Initialize S3 state
      working-directory: infra/monitor
      run: terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="key=monitor/terraform.tfstate"
        -backend-config="region=ap-south-2" -backend-config="use_lockfile=true"
    - name: Validate Terraform
      working-directory: infra/monitor
      run: terraform validate
    - name: Plan infrastructure
      working-directory: infra/monitor
      run: terraform plan -input=false -out=deploy.tfplan
    - name: Apply saved plan
      working-directory: infra/monitor
      run: terraform apply -input=false deploy.tfplan
    - name: Read deployment outputs
      run: terraform -chdir=infra/monitor output -json > monitor-output.json
    - name: Install deployment SDK
      run: pip install "boto3>=1.35,<2"
    - name: Build and deploy agent through SSM
      run: python scripts/deploy_agent.py
